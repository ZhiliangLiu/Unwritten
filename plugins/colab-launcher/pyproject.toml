[project]
name = "unwritten-colab-launcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.5"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-aiohttp==1.1.1", "ruff==0.17.5"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]
"tests/serve_with_fakes.py" = ["E402", "S101", "S104", "S105", "S106"]
"launcher/cli.py" = ["S603", "S607"]
"bootstrap.py" = ["S202"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
