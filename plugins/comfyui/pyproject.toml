[project]
name = "unwritten-comfyui"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.5", "Pillow==13.0.0"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-aiohttp==1.1.1", "ruff==0.17.5"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["colab.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"colab_service.py" = ["S106", "S603"]
"server/config.py" = ["S108"]
"server/manifest.py" = ["S607"]
"tests/serve_with_fakes.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
