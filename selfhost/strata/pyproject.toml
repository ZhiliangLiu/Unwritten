[project]
name = "unwritten-strata-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.5"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-aiohttp==1.1.1", "ruff==0.17.5"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"gateway/state_file.py" = ["S108"]
"colab_service.py" = ["S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
