glob_matcher: doublestar

pre-commit:
  jobs:
    - name: oxlint
      glob: "**/*.{ts,tsx,js,mjs}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    - name: stylelint
      glob: "apps/client/src/**/*.css"
      run: pnpm exec stylelint --fix {staged_files}
      stage_fixed: true
    - name: ruff
      glob: "{plugins,selfhost}/**/*.py"
      run: node scripts/ruff-staged.mjs {staged_files}
      stage_fixed: true
    - name: prettier
      glob:
        - "{apps,packages,e2e,scripts}/**/*.{ts,tsx,js,mjs,json,css,md}"
        - "*.{json,mjs}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
